name: Deploy course to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Build website and practice downloads
        run: npm run build
      - name: Check pages and downloads
        run: node scripts/check-site.mjs
      - name: Check existing self-review and regression behavior
        run: |
          node --test tests/self-review.test.mjs
          python3 tests/regression-checker.py
      - name: Check out the independent Portal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zhangjian0410/ai-training-portal
          ref: main
          path: portal
          persist-credentials: false
      - name: Record Portal revision
        id: portal-source
        run: echo "revision=$(git -C portal rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Assemble course into Portal and check the canonical backend
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          COURSE_SOURCE_DIR="$GITHUB_WORKSPACE" SKIP_COURSE_BUILD=1 PORTAL_REVISION="$(git -C portal rev-parse HEAD)" npm --prefix portal run build
          npm --prefix portal run check
          cd portal
          node --test tests/community-api.test.mjs tests/handoff.test.mjs
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository's Actions secrets."
            exit 1
          fi
      - name: Publish the assembled Portal first
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          workingDirectory: portal
          command: pages deploy dist --project-name=archer-ai-courses --branch=main --commit-hash=${{ steps.portal-source.outputs.revision }}
      - name: Publish legacy compatibility after Portal succeeds
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages deploy dist --project-name=skill-engineering-guide --branch=main --commit-hash=${{ github.sha }}
